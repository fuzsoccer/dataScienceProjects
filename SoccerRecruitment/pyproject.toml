[project]
name = "soccer-recruitment"
version = "0.1.0"
description = "Auditable event and tracking analytics for a recruitment portfolio"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
soccer = "soccer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
