name: Soccer recruitment checks

on:
  push:
    paths:
      - 'SoccerRecruitment/**'
      - '.github/workflows/soccer-checks.yml'
  pull_request:
    paths:
      - 'SoccerRecruitment/**'
      - '.github/workflows/soccer-checks.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: SoccerRecruitment

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit and notebook-contract tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line entry point
        run: python scripts/run.py --help
